description: >
  Full-cycle quadrature sensor for the PrimeOrb EC12E2440301 (24 detents,
  24 pulses). Both active-high GPIOs must be on the same controller.
  Pull-ups make the open/open detent state 11. Samples report degrees.
compatible: "primeorb,encoder"
include: sensor-device.yaml
properties:
  a-gpios:
    type: phandle-array
    required: true
  b-gpios:
    type: phandle-array
    required: true
  detents-per-rotation:
    type: int
    required: true
    const: 24
